<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenNursing">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light dark}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style><title>EHR Simulator · Open Resource Nursing</title>
<meta name="description" content="A free, open EHR simulator for nursing students: self-guided clinical scenarios with fictional patients, goals of care designations and a clinical judgment debrief.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: hospital workstation in the site's Clinical Slate & Sage palette (matches the homepage) — scenario picker → unit census → patient chart (side navigation + working panel) → debrief */
:root{
  --bg:#F7F8F7; --surface:#FFFFFF; --sunk:#EDF1EE; --ink:#1C2B2D; --muted:#526568; --line:#CBD6D2;
  --accent:#1F3A3D; --accent-ink:#FFFFFF; --accent-soft:#E3ECE9; --sage:#4A7C7E;
  --bar:#FFFFFF; --bar-ink:#1F3A3D; --bar-line:#CBD6D2; --bar-muted:#526568; --brand-red:#C75B39; --brand:#C75B39; --brand-ink:#A94A2B;
  --red:#C8102E; --red-soft:#FDE8EC; --amber:#9A5B00; --amber-soft:#FFF3DE; --green:#2B7A3A; --green-soft:#E5F4E8;
  --shadow:0 4px 16px rgba(31,58,61,.07); --radius:8px;
  --f-ui:Calibri,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  --f-cond:Cambria,Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1C; --surface:#152628; --sunk:#112022; --ink:#E4EDEB; --muted:#9DB2B0; --line:#29403F;
  --accent:#89B4B6; --accent-ink:#0E1A1C; --accent-soft:#1B3335; --sage:#5E9496;
  --bar:#152628; --bar-ink:#E4EDEB; --bar-line:#29403F; --bar-muted:#9DB2B0; --brand-red:#F4A287; --brand:#F4A287; --brand-ink:#F4A287;
  --shadow:0 4px 16px rgba(0,0,0,.3);
  --red:#FF7A8C; --red-soft:#3A1520; --amber:#F2B35A; --amber-soft:#33270F; --green:#74CF83; --green-soft:#16301B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1C; --surface:#152628; --sunk:#112022; --ink:#E4EDEB; --muted:#9DB2B0; --line:#29403F;
  --accent:#89B4B6; --accent-ink:#0E1A1C; --accent-soft:#1B3335; --sage:#5E9496;
  --bar:#152628; --bar-ink:#E4EDEB; --bar-line:#29403F; --bar-muted:#9DB2B0; --brand-red:#F4A287; --brand:#F4A287; --brand-ink:#F4A287;
  --shadow:0 4px 16px rgba(0,0,0,.3);
  --red:#FF7A8C; --red-soft:#3A1520; --amber:#F2B35A; --amber-soft:#33270F; --green:#74CF83; --green-soft:#16301B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;left:-9999px}
.muted{color:var(--muted)} .small{font-size:12.5px} .nowrap{white-space:nowrap}
.tx-red{color:var(--red)} .tx-amber{color:var(--amber)}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)} .stack-s{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.simple.wide{min-width:640px}
.notice.more.phone{display:none}
@media (max-width:640px){.notice.older,.notice.more.desk{display:none}.notice.more.phone{display:flex}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center} .row-s{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *,.row-s > *{min-width:0}
.between{justify-content:space-between} .end{justify-content:flex-end}
.spacer{flex:1}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--brand-ink);font-weight:700;margin-bottom:4px}
.h1{font-family:var(--f-cond);font-size:24px;margin:0;color:var(--accent);text-wrap:balance}

/* header */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--bar-ink);border-bottom:2.5px solid var(--sage);box-shadow:0 2px 12px rgba(31,58,61,.06)}
.appbar .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{height:44px;width:44px;display:block}
.brandtxt{display:grid;border-left:1px solid var(--bar-line);padding-left:14px;line-height:1.2}
.brandtxt b{font-family:var(--f-cond);font-size:19px;font-weight:700;color:var(--bar-ink);letter-spacing:-.01em}
.brandtxt small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bar-muted);font-weight:600}
.clock{display:flex;gap:6px;align-items:baseline}
.clock .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--bar-muted);font-weight:600}
.clock .t{font-family:var(--f-mono);font-size:18px;font-weight:600}
.paused{font-size:11px;font-weight:700;color:#9A5B00;background:#FFF3DE;border-radius:3px;padding:1px 6px}
.barbtn{background:var(--bar);border:1.5px solid var(--bar-ink);color:var(--bar-ink);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:700}
.barbtn:hover{background:var(--bar-ink);color:var(--bar)}
.barbtn.hot{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--accent-ink)}
.who{font-size:13px;color:var(--bar-muted)}
.homelink{font-size:13px;font-weight:700;color:var(--bar-muted);text-decoration:none;border:1px solid transparent;border-radius:6px;padding:5px 10px}
.homelink:hover{background:var(--sunk);border-color:var(--line);color:var(--bar-ink)}
@media (max-width:600px){.logo{height:34px}.brandtxt b{font-size:15px}.brandtxt small{display:none}}

/* notices */
.noticewrap{display:grid;gap:6px;padding-block:8px;background:var(--amber-soft);border-bottom:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.notice .mono{font-weight:600}
.notice.more{color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;margin-left:auto}

/* common */
.btn{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:6px;padding:8px 14px;font-weight:700;transition:background .15s,border-color .15s}
.btn:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:var(--red);border-color:var(--red);filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:13px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea.input{resize:vertical}
.w-auto{width:auto} .w-80{width:80px} .w-100{width:100px}
.field{display:grid;gap:3px;min-width:0}
.field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}
.chk.strong{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.pill.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.pill.crit{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.pill.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.news{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:4px;font-family:var(--f-mono);font-weight:700;padding:0 5px}
.news.ok{background:var(--green-soft);color:var(--green)}
.news.warn{background:var(--amber-soft);color:var(--amber)}
.news.crit{background:var(--red);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card > h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-cond);font-size:16.5px;color:var(--accent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card > h3 .note{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--muted)}
.card .body{padding:12px 14px}
.card.attn{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.card.critcard{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.card.critcard > h3{color:var(--red)}
.scroll{overflow-x:auto}
.panel{padding-block:18px 48px;display:grid;gap:16px}
.panel > *{min-width:0}
.grid2c{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid2c > *{min-width:0}
.span2{grid-column:1 / -1}
table.simple{border-collapse:collapse;width:100%;font-size:13px}
table.simple th,table.simple td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.simple th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:600}

/* start */
.start{max-width:1040px;margin:0 auto;padding-block:28px 48px;display:grid;gap:20px}
.start h1{font-family:var(--f-cond);font-size:34px;margin:0;color:var(--accent);text-wrap:balance}
.start h1::after{content:"";display:block;width:56px;height:3px;background:var(--brand-red);margin-top:8px}
.lead{margin:0;color:var(--muted);max-width:65ch}
.ptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ptcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sage);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;text-align:left;display:grid;gap:5px}
.ptcard:hover{border-color:var(--accent)}
.ptcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ptcard .nm{font-weight:700;font-size:15px}
.ptcard .meta{font-size:12px;color:var(--muted)}
.room{font-family:var(--f-mono);font-weight:700;color:var(--accent)}

/* census */
table.census{border-collapse:collapse;width:100%;min-width:860px}
table.census th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-weight:600}
table.census td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.census tbody tr[data-act]{cursor:pointer}
table.census tbody tr[data-act]:hover{background:var(--accent-soft)}
table.census .nm{font-weight:700}
table.census tr.notmine{opacity:.6}
table.census tr.emptybed td{color:var(--muted);font-style:italic}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.wl{padding:10px 0;border-bottom:1px solid var(--line)} .wl:last-child{border-bottom:0}
.wlhead{margin-bottom:6px}
.tasklist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 8px;border-radius:4px}
.task.tk-overdue{background:var(--red-soft)} .task.tk-due{background:var(--amber-soft)}

/* chart */
.banner{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bannerin{display:flex;flex-wrap:wrap;gap:8px 24px;padding-block:10px;align-items:flex-start}
.back{align-self:center}
.pname{font-family:var(--f-cond);font-size:21px;font-weight:700;line-height:1.1}
.pname .pref{font-family:var(--f-ui);font-weight:500;font-size:14px;color:var(--muted)}
.pname .sub{display:block;font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.kv{display:grid;gap:1px}
.kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kv .v{font-weight:600}
.allergy{background:var(--red-soft);border:1px solid var(--red);border-radius:4px;padding:3px 10px}
.allergy .k,.allergy .v{color:var(--red)} .allergy .rx{font-weight:400}
.iso{background:var(--amber-soft);border:1px solid var(--amber);border-radius:4px;padding:3px 10px}
.iso .k,.iso .v{color:var(--amber)}
.chartgrid{display:grid;grid-template-columns:200px 1fr;gap:18px;padding-block:16px 48px;align-items:start}
.chartmain{display:grid;gap:16px;min-width:0}
.sidenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sage);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.sidenav button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.sidenav button:hover{background:var(--sunk);color:var(--ink)}
.sidenav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.badge{background:var(--brand-ink);color:var(--accent-ink);font-weight:700;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
@media (max-width:860px){
  .chartgrid{grid-template-columns:1fr}
  .sidenav{position:static;display:flex;overflow-x:auto;gap:4px}
  .sidenav button{white-space:nowrap}
}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.vt{display:grid;gap:1px}
.vt .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.vt .v{font-size:17px;font-weight:600}
.vt .u{font-size:11.5px;color:var(--muted)}
.oline{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.oline:last-child{border-bottom:0}
.struck,.oline.struck > div:first-child{text-decoration:line-through;color:var(--muted)}

/* MAR */
.scanrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px}
.scanform{display:flex;gap:8px;flex:1 1 300px;min-width:0}
table.mar{border-collapse:collapse;width:100%;min-width:640px}
table.mar td{border-bottom:1px solid var(--line);padding:10px 14px;vertical-align:top}
table.mar tr:last-child td{border-bottom:0}
.medc{width:58%}
@media (max-width:700px){table.mar{min-width:0}table.mar td{display:block;width:auto;border-bottom:0}table.mar td.times{padding-top:0}table.mar tr{display:block;border-bottom:1px solid var(--line)}.medc{width:auto}}
.drug{font-weight:700;font-size:14.5px}
.drug .dose{font-weight:600;color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.times{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
td.times{display:table-cell}
td.times > *{margin:0 6px 6px 0}
.due{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:5px 10px;font-family:var(--f-mono);font-weight:600}
.due.duenow{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.due.overdue{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.due:hover{filter:brightness(.95)}
.done{display:inline-grid;justify-items:center;font-family:var(--f-mono);font-size:12px;border-radius:4px;padding:3px 8px;border:1px solid var(--green);color:var(--green);background:var(--green-soft)}
.done.held{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

/* flow */
.monitor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#101D21;color:#E9F0EE;border-radius:var(--radius);border-top:3px solid var(--brand);padding:12px}
.monitor div{display:grid}
.monitor .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9DB5B3}
.monitor .v{font-family:var(--f-mono);font-size:24px;font-weight:600;color:#7CF2A6}
.monitor div:nth-child(2) .v{color:#FFB4C0}
.monitor div:nth-child(3) .v{color:#8CD3FF}
.monitor div:nth-child(4) .v{color:#FFE08A}
.monitor .u{font-size:11px;color:#9DB5B3}
@media (max-width:480px){.monitor{grid-template-columns:repeat(2,1fr)}}
.obs{margin-top:8px;font-size:13px;background:var(--amber-soft);border-radius:4px;padding:6px 10px}
.vform{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vform .span2{grid-column:1 / -1}
.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.trend{margin:0}
.trend figcaption{display:flex;gap:6px;align-items:baseline;font-size:12.5px;font-weight:600}
.trend svg{width:100%;height:auto;display:block}
.iotot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.iotot div{display:grid;background:var(--sunk);border-radius:4px;padding:8px}
.iotot .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* assess */
.systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
fieldset.sys{border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px 12px;margin:0;display:grid;gap:6px;min-width:0}
fieldset.sys legend{font-weight:700;font-family:var(--f-cond);color:var(--accent);padding:0 4px}
.chks{display:grid;gap:3px}
.hist{padding:6px 0;border-bottom:1px solid var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.pkg{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;gap:5px}
.pkg .nm{font-weight:700}

/* notes, thread */
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.noteitem{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:4px;font-size:13.5px}
.amend{font-size:12.5px}
.thread{gap:10px}
.msg{background:var(--sunk);border-radius:6px;padding:8px 12px;max-width:85%;display:grid;gap:3px}
.msg.me{justify-self:end;background:var(--accent-soft)}
textarea.mono-ish{font-family:var(--f-mono);font-size:13px;line-height:1.55}

/* faculty */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-red)}
.bigclock{font-size:32px;font-weight:600;color:var(--accent)}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.toggle{width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{left:22px;background:var(--accent-ink)}
.checklist li{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.checklist .mark{font-weight:700;width:18px;flex:none}
.checklist .met .mark{color:var(--green)} .checklist .miss .mark{color:var(--red)} .checklist .na{color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:3px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.logbox{max-height:520px;overflow:auto}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}

/* scenario picker, directions, debrief */
.hero{display:grid;gap:8px}
.start .hero{background:#1F3A3D;color:#FFFFFF;border:1px solid var(--line);border-top:4px solid #C75B39;border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px}
.start .hero .eyebrow{color:#F4A287;letter-spacing:.14em}
.start .hero h1{color:#FFFFFF}
.start .hero h1::after{background:#C75B39}
.start .hero .lead{color:#D7E4E4;font-family:Cambria,Georgia,serif;font-size:16.5px;line-height:1.6;max-width:72ch}
@media (max-width:600px){.start .hero{padding:22px 20px}}
.h2{font-family:var(--f-cond);font-size:21px;margin:0;color:var(--accent)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.sccard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sage);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s;padding:14px 16px;display:grid;gap:8px;align-content:start}
.sccard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(31,58,61,.13)}
.sccard h3{margin:0;font-family:var(--f-cond);font-size:18px;color:var(--accent)}
.sccard p{margin:0;font-size:13.5px}
.lvhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:22px 0 10px}.h3{margin:0;font-family:var(--f-cond);font-size:19px;color:var(--accent)}.best{color:var(--brand-ink)}.stage{color:var(--brand-ink);font-weight:700}.lvhead .small{max-width:720px}
.sctitle{display:flex;gap:10px;align-items:flex-start}.sctitle h3{padding-top:2px;min-width:0}
.scnum{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:var(--f-mono);flex:none}
.ptchip{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 9px;background:var(--sunk)}
.gcd{display:inline-flex;align-items:center;gap:2px;border-radius:4px;padding:1px 7px;font-family:var(--f-mono);font-weight:700;font-size:12.5px;border:1px solid;cursor:pointer;background:var(--surface);white-space:nowrap}
.gcd.static{cursor:default;font-size:11px;padding:0 5px}
.gcd-R{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.gcd-M{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.gcd-C{color:#6B3FA0;border-color:#6B3FA0;background:#F1EAFB}
.gcd-none{color:var(--red);border-color:var(--red);background:var(--red-soft);font-family:var(--f-ui)}
.gcdtxt{font-family:var(--f-ui);font-weight:500;font-size:12px;white-space:normal}
:root[data-theme="dark"] .gcd-C{color:#C9A9F5;border-color:#C9A9F5;background:#2A1D3D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gcd-C{color:#C9A9F5;border-color:#C9A9F5;background:#2A1D3D}}
table.gcdtab tr.hi td{background:var(--accent-soft);font-weight:600}
.narrow{max-width:900px;margin:0 auto}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.steps.compact{gap:3px;font-size:13px}
.tips{margin:0;padding-left:18px;display:grid;gap:6px}
.card.brief{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.hint{display:block;font-size:12px;color:var(--brand-ink);font-weight:700}
.actlist{gap:0}
.actrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.actrow:last-child{border-bottom:0}
.drawer{border:1px dashed var(--line);border-radius:var(--radius);padding:10px;display:grid;gap:8px;background:var(--sunk)}
.pkgbtn{display:grid;text-align:left;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600}
.pkgbtn:hover{border-color:var(--accent)}
.meter{height:10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand)}
.cjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cjcell{display:grid;gap:2px;background:var(--sunk);border-radius:4px;padding:8px 10px}
.cjcell b{font-family:var(--f-mono);font-size:16px}
.debrief li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.debrief li:last-child{border-bottom:0}
.debrief .mark{font-weight:700;width:18px;flex:none;font-size:16px}
.debrief .met .mark{color:var(--green)} .debrief .miss .mark{color:var(--red)} .debrief .na{color:var(--muted)}
.cjtag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}

/* modal, toast */
.scrim{position:fixed;inset:0;background:rgba(11,20,24,.72);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);width:min(560px,100%);max-height:100%;overflow:auto;display:grid}
.modal.wide{width:min(760px,100%)}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;border-top:4px solid var(--brand-red);border-radius:8px 8px 0 0}
.modal header h2{margin:0;font-family:var(--f-cond);font-size:20px;color:var(--accent)}
.mbody{padding:14px 16px;display:grid;gap:12px}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.summary{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:13px;display:grid;gap:2px}
.warnbox{border:1px solid var(--red);background:var(--red-soft);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.warnbox b{color:var(--red)} .warnbox ul{margin:0;padding-left:18px}
.alertbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 4px 4px 0}
.alertbox.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.alertbox.crit{border-left-color:var(--red);background:var(--red-soft)}
.alertbox.ok{border-left-color:var(--green);background:var(--green-soft)}
.rp-ver svg{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#101D21;color:#FFFFFF;border-left:4px solid #C75B39;padding:9px 16px;border-radius:6px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted);padding-block:14px 24px;border-top:2px solid var(--sage);margin-top:8px}
.foot a{color:var(--brand-ink);font-weight:700}
@media print{.appbar,#noticeBar,.homelink,.foot,.noprint,#modalRoot,.toast,body::before{display:none!important}body{background:#fff!important}.panel{padding:0}.wrap{padding:0}.rp{border:0!important;padding:0!important;max-width:none!important}}
.rpwrap{overflow-x:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* =====================================================================
   SCENARIO FRAMEWORK — shared helpers, goals of care, nursing actions,
   debrief helpers. All patients in every scenario are fictional.
   Times are minutes from 00:00 today; negative = yesterday.
   ===================================================================== */
const T = (h, m = 0) => h * 60 + m;
const Y = (h, m = 0) => h * 60 + m - 1440;
const D2 = (h, m = 0) => h * 60 + m - 2880;
const V = (t, temp, hr, rr, sbp, dbp, spo2, o2, flow, avpu, pain, poss, by = 'Night RN') =>
  ({ t, temp, hr, rr, sbp, dbp, spo2, o2, flow, avpu, pain, poss, by });
const med = (id, m, extra = {}) => ({ id, type: 'med', status: 'active', by: extra.by || null, t: extra.t ?? Y(10), source: 'Written', med: m, ...extra });
const ord = (id, type, text, extra = {}) => ({ id, type, text, status: 'active', t: extra.t ?? Y(10), source: 'Written', ...extra });
const tel = (t, by) => ({ t, source: 'Telephone', by, status: 'new' });

const HOSPITAL = 'Lakeview General Hospital';
const GENERIC_REPLY_TEXT = 'Thanks for the update. Continue to monitor and call me with any change.';

/* ---- goals of care designations (Alberta Health Services scale) ---- */
const GCD = {
  R1: { approach: 'Resuscitative', short: 'Full resuscitation, including CPR, intubation and ICU', icu: 'Yes', intubation: 'Yes', cpr: 'Yes', transfer: 'Yes',
    text: 'Every appropriate treatment to prolong life, including chest compressions, intubation and intensive care.' },
  R2: { approach: 'Resuscitative', short: 'ICU and intubation, no chest compressions', icu: 'Yes', intubation: 'Yes', cpr: 'No', transfer: 'Yes',
    text: 'Intensive care and intubation if needed, but no chest compressions if the heart stops.' },
  R3: { approach: 'Resuscitative', short: 'ICU, no intubation or chest compressions', icu: 'Yes', intubation: 'No', cpr: 'No', transfer: 'Yes',
    text: 'Intensive care, but neither intubation nor chest compressions.' },
  M1: { approach: 'Medical', short: 'Medical treatment and transfer to acute care, no ICU or resuscitation', icu: 'No', intubation: 'No', cpr: 'No', transfer: 'Yes',
    text: 'Tests and treatment to cure or control illness, including transfer to acute care. No ICU, intubation or resuscitation.' },
  M2: { approach: 'Medical', short: 'Medical treatment where the person is now, no transfer', icu: 'No', intubation: 'No', cpr: 'No', transfer: 'No',
    text: 'Treatment in the current setting (home or continuing care) without transfer to acute care. No ICU, intubation or resuscitation.' },
  C1: { approach: 'Comfort', short: 'Comfort and symptom control', icu: 'No', intubation: 'No', cpr: 'No', transfer: 'Generally no',
    text: 'Symptom control and function, not cure. New illnesses are treated only if that helps comfort.' },
  C2: { approach: 'Comfort', short: 'Imminently dying: comfort and family support', icu: 'No', intubation: 'No', cpr: 'No', transfer: 'Usually no',
    text: 'Death is expected within hours or days. All care aims at comfort and support for loved ones.' },
};
const gcdLabel = g => g ? g : 'Not documented';

/* ---- clinical judgment steps (NCSBN Clinical Judgment Measurement Model) ---- */
const CJ = ['Recognize cues', 'Analyze cues', 'Prioritize hypotheses', 'Generate solutions', 'Take action', 'Evaluate outcomes'];

/* ---- nursing actions (Interventions tab) ----
   key: { label, desc, ask?: placeholder for a detail field, result?(p,S,t) → text shown and logged } */
const NURSING_ACTIONS = {
  bladderScan: { label: 'Bladder scan', desc: 'Measure the volume of urine in the bladder.', result: p => `Bladder scan: ${monitor(p).bladder ?? 80} mL` },
  checkCatheter: { label: 'Check urinary catheter', desc: 'Check tubing for kinks, the bag position and the urine.', result: p => monitor(p).catheterNote || 'Catheter patent; tubing free of kinks; bag below bladder level.' },
  removeCatheter: { label: 'Remove urinary catheter', desc: 'Remove the indwelling catheter and note the time.', result: (p, S, t) => `Catheter removed at ${hm(t)}. Must void within 6 h (by ${hm(t + 360)}).` },
  inOutCath: { label: 'In-and-out catheterization', desc: 'Drain the bladder with a straight catheter.', result: p => `Drained ${monitor(p).bladder ?? 400} mL of urine.` },
  coachIS: { label: 'Coach incentive spirometry and deep breathing', desc: '10 breaths every hour while awake.', result: () => 'Patient used the spirometer 10 times, reaching 1,250 mL; coughed up a little clear sputum.' },
  ambulate: { label: 'Help the patient walk', desc: 'Walk in the hallway with assistance.', result: () => 'Walked 30 m in the hallway with one assist; tolerated well.' },
  bloodCultures: { label: 'Draw blood cultures ×2', desc: 'Two sets from two separate sites, before antibiotics.', result: (p, S, t) => `Blood cultures ×2 drawn at ${hm(t)} and sent to the lab.` },
  fallsPrecautions: { label: 'Falls precautions in place', desc: 'Bed low and locked, bed alarm on, call bell and urinal within reach, non-slip socks.' },
  reposition: { label: 'Reposition and mouth care', desc: 'Turn and support with pillows; moisten mouth and lips.' },
  comfortBreathing: { label: 'Comfort measures for breathlessness', desc: 'Sit upright, fan to the face, stay with the patient, slow calm breathing.' },
  secondIV: { label: 'Start a second large-bore IV', desc: 'Insert or arrange a second 18 G peripheral IV.' },
  prepTransfusion: { label: 'Prepare for transfusion', desc: 'Confirm consent and type and screen, request blood, arrange the two-person check.' },
  keepNPO: { label: 'Keep NPO', desc: 'Nothing by mouth; explain why to the patient.' },
  familyUpdate: { label: 'Update the family', desc: 'Talk with the family about what is happening.', ask: 'What you told them' },
  callRRT: { label: 'Call the rapid response team', desc: 'Urgent bedside review by the critical care outreach team.' },
  callHelp: { label: 'Ask the RN or charge nurse for help', desc: 'Get another nurse to the bedside or ask for advice.', ask: 'What you asked for' },
  delegate: { label: 'Delegate a task to the care provider', desc: 'Assign a task to the unregulated care provider (personal support worker).', ask: 'Task delegated' },
  callPharmacy: { label: 'Call pharmacy', desc: 'Report a missing or wrong medication, or ask a medication question.', ask: 'Reason for the call' },
  holdDischarge: { label: 'Put discharge on hold', desc: 'Stop the discharge until the patient has been reviewed.' },
  stayWithPatient: { label: 'Stay with the patient', desc: 'Remain at the bedside; reassure; watch closely.' },
  elevateLimb: { label: 'Elevate the limb and apply a cool compress', desc: 'Raise the affected limb above heart level; cool (not cold) compress for comfort.' },
  bloodCheck: { label: 'Bedside blood check with a second nurse', desc: 'Two identifiers on the wristband, requisition and unit tag; ABO/Rh; unit number; expiry; consent; product matches the order.', ask: 'Name of the second nurse', result: p => monitor(p).bloodNote || 'All checks match: patient name, MRN, unit number, ABO/Rh and expiry. Consent on the chart.' },
  stopBlood: { label: 'Stop the transfusion', desc: 'Clamp the blood, disconnect the blood tubing at the hub, and keep the IV open with normal saline through NEW tubing.', result: (p, S, t) => `Transfusion stopped at ${hm(t)}. Saline running through new tubing to keep the vein open.` },
  returnBlood: { label: 'Return the unit to the blood bank', desc: 'Send the bag, tubing and tags with the reaction form and any samples ordered.' },
  checkDressing: { label: 'Check the dressing and drain', desc: 'Look at the dressing (and under the patient), the drain bulb and its output.', result: p => monitor(p).dressingNote || 'Dressing dry and intact. Drain has a small amount of serosanguinous fluid.' },
  reinforceDressing: { label: 'Reinforce the dressing and mark the drainage', desc: 'Add pads, apply firm pressure, outline the edge of the drainage with the time.' },
  strokeScreen: { label: 'Stroke screen (FAST) and last known well', desc: 'Face, arms, speech, time. Ask when the patient was last seen normal.', result: p => monitor(p).neuroNote || 'Face symmetrical; no arm drift; speech clear. No new deficit.' },
  codeStroke: { label: 'Call a code stroke', desc: 'Activate the stroke team for a sudden neurological deficit.' },
  swallowScreen: { label: 'Bedside swallow screen', desc: 'Upright; sips of water by teaspoon, then cup; watch for coughing, wet voice or drooling.', result: p => monitor(p).swallowNote || 'Passed: no coughing, voice clear after 3 teaspoons and a cup of water.' },
  stopOral: { label: 'Stop oral intake and sit upright', desc: 'Remove the food and drink, sit fully upright, suction the mouth if needed, and check breathing.' },
  seizurePrecautions: { label: 'Seizure precautions', desc: 'Bed low with padded rails, suction and oxygen at the bedside, IV patent.' },
  seizureCare: { label: 'Manage the seizure', desc: 'Stay, time it, turn on the side, protect the head, nothing in the mouth, oxygen, suction after, call for help.', result: () => 'Seizure timed; patient turned to the side; head protected; oxygen applied.' },
  reduceStimulation: { label: 'Reduce stimulation', desc: 'Quiet, well-lit room; one calm voice; reorient; a family member at the bedside if helpful.' },
  incidentReport: { label: 'File a safety (incident) report', desc: 'Report an error or near miss through the hospital’s safety reporting system.', ask: 'What happened' },
  fundalCheck: { label: 'Fundal check', desc: 'Palpate the fundus: height, position (midline or displaced) and tone (firm or boggy).', result: p => monitor(p).fundusNote || 'Fundus firm, midline, at the umbilicus.' },
  fundalMassage: { label: 'Fundal massage', desc: 'Support the lower uterus with one hand and massage the fundus until it firms.', result: p => monitor(p).massageNote || 'Fundus firmed with massage; a small gush of clots expressed.' },
  weighPads: { label: 'Weigh pads and quantify blood loss', desc: 'Weigh the saturated pads and chux: 1 g = 1 mL.', result: p => monitor(p).qblNote || 'Pad weight shows 60 mL of blood loss since the last change.' },
  checkTube: { label: 'Check feeding tube placement and flush', desc: 'Check the external length mark, aspirate and test the pH, then flush with 30 mL of water.', result: p => monitor(p).tubeNote || 'Tube at the 58 cm mark as documented; aspirate pH 4; flushed with 30 mL water.' },
  holdFeed: { label: 'Pause the tube feed', desc: 'Stop the pump; keep the head of the bed up.', result: (p, S, t) => `Feed paused at ${hm(t)}.` },
  headUp: { label: 'Head of bed up 30–45°', desc: 'Raise the head of the bed and keep it up during and for 30–60 minutes after a feed.' },
  stopInfusion: { label: 'Stop the IV infusion', desc: 'Clamp the medication, disconnect it at the hub and keep the IV open with saline on new tubing.', result: (p, S, t) => `Infusion stopped at ${hm(t)}. Saline running to keep the vein open.` },
  ecg: { label: '12-lead ECG', desc: 'Obtain a 12-lead ECG at the bedside (nurse-initiated under the chest pain protocol).', result: p => monitor(p).ecgNote || 'Sinus rhythm, no acute changes.' },
  fistulaCheck: { label: 'Check the dialysis access', desc: 'Feel for the thrill and listen for the bruit over the fistula; no BP or blood work on that arm.', result: p => monitor(p).fistulaNote || 'Left forearm fistula: thrill present, bruit heard. Arm sign in place.' },
  postFall: { label: 'Post-fall assessment', desc: 'Before moving the patient: level of consciousness, pain, head, neck, hips and limbs, skin, vital signs.', result: p => monitor(p).fallNote || 'Alert; no pain; moving all limbs; no deformity.' },
  neuroChecks: { label: 'Start neuro checks (hourly)', desc: 'GCS, pupils and limb strength every hour.' },
  oralRehydration: { label: 'Oral rehydration, small frequent amounts', desc: 'Offer 5 mL of oral rehydration solution every 2–5 minutes by syringe or spoon.', result: p => monitor(p).orsNote || 'Took 60 mL of oral rehydration solution over 30 minutes without vomiting.' },
  weighDiaper: { label: 'Weigh the diaper', desc: 'Weigh the wet diaper and subtract the dry weight: 1 g = 1 mL.', result: p => monitor(p).diaperNote || 'Diaper weight: 40 mL of urine.' },

  holdTray: { label: 'Hold the meal tray', desc: 'Send the tray back or keep it away from the patient until it is safe.', ask: 'Why the tray is held' },

/* ---- debrief helpers, used by scenario files ---- */
const did = (p, key, after = -1e9, before = 1e9) => (p.actions || []).some(a => a.key === key && a.t >= after && a.t <= before);
const didAt = (p, key) => (p.actions || []).find(a => a.key === key)?.t ?? null;
const marDose = (p, orderId, time) => p.mar[`${orderId}@${time}`];
const givenAt = (p, orderId, time) => !!marDose(p, orderId, time)?.given;
const heldAt = (p, orderId, time) => { const d = marDose(p, orderId, time); return !!d && !d.given; };
const prnGiven = (p, orderId, after = -1e9) => p.prn.filter(d => d.orderId === orderId && d.given && d.student && d.t >= after);
const prnReassessed = (p, orderId, within = 60) => { const ds = prnGiven(p, orderId); return ds.length ? ds.every(d => d.reassess && d.reassess.t - d.t <= within) : false; };
const sbarMatch = (p, re, after = -1e9) => p.messages.some(m => m.from === 'student' && m.t >= after && re.test(Object.values(m.sbar || {}).join(' ')));
const firstSbarAfter = (p, after) => p.messages.filter(m => m.from === 'student' && m.t >= after).sort((a, b) => a.t - b.t)[0]?.t ?? null;
const resultAcked = (p, id) => !!p.results.find(r => r.id === id)?.ackT;
const resultAckedTest = (p, re) => p.results.some(r => re.test(r.test) && r.needsAck && r.ackT);
const vitalsBetween = (p, a, b = 1e9) => p.vitals.filter(v => v.student && v.t >= a && v.t <= b);
const assessDone = (p, kind, after = -1e9) => p.assess.some(a => a.kind === kind && a.t >= after);
const systemsDone = (p, sys, after = -1e9) => p.assess.some(a => a.kind === 'systems' && a.t >= after && (!sys || a.data[sys]));
const noteMatch = (p, re, after = -1e9) => p.notes.some(n => n.student && n.written >= after && re.test(Object.values(n.body).join(' ')));
const eduMatch = (p, re, after = -1e9) => p.education.filter(e => e.t >= after && re.test(e.topic + ' ' + e.method + ' ' + e.response));
const handoffMatch = (p, to, re) => (p.handoffs || []).some(h => (!to || h.to === to) && (!re || re.test(h.text)));
const orderAcked = (p, id) => { const o = p.orders.find(x => x.id === id); return !!o && o.status !== 'new' && (o.source === 'Written' || !!o.readBack); };
const ioAfter = (p, a) => p.io.some(i => i.by && i.t >= a);
const glucoseAfter = (p, a, b = 1e9) => p.glucose.filter(g => g.student && g.t >= a && g.t <= b);
const o2NeverAbove = (p, max) => !(p.o2Log || []).some(x => x.flow > max);
const actionDetail = (p, key, re) => (p.actions || []).some(a => a.key === key && re.test(a.detail || ''));

/* ---- registry ---- */
const SCN = {};
function defineScenario(s) {
  for (const p of Object.values(s.patients)) {
    for (const [k, v] of Object.entries({ orders: [], vitals: [], results: [], reports: [], io: [], lda: [], notes: [], careplan: [], education: [], homeMeds: [], prn: [], weights: [], glucose: [], actions: [], handoffs: [] })) if (!p[k]) p[k] = v;
    if (p.medrecDone == null) p.medrecDone = true;
    if (!p.o2) p.o2 = { device: 'RA', flow: 0 };
    if (!p.vsFreq) p.vsFreq = 240;
    if (!p.fall) p.fall = 'Low';
    if (!p.pref) p.pref = p.name.split(' ')[0];
  }
  SCN[s.id] = s;
}

/* active scenario globals (set by useScenario) */
let SC = null, SEED = {}, EVENTS = [], REPLIES = {}, DYN = {}, DEBRIEF = {}, UNIT = {}, ROOMS = [], PRESCRIBERS = {};
function useScenario(id) {
  SC = SCN[id]; if (!SC) return false;
  SEED = SC.patients; EVENTS = SC.events.map(e => ({ ...e })); REPLIES = SC.replies || {}; DYN = SC.dyn || {}; DEBRIEF = SC.debrief || [];
  UNIT = SC.unit; ROOMS = SC.rooms; PRESCRIBERS = SC.prescribers;
  return true;
}

      <td><div class="flags">${newO ? `<span class="pill acc">${newO} new order${newO > 1 ? 's' : ''}</span>` : ''}${newR ? `<span class="pill crit">${newR} result</span>` : ''}${newM ? `<span class="pill acc">${newM} message</span>` : ''}</div></td>
    </tr>`;
  }).join('');
  return `<section class="wrap panel">
    <div class="row between"><div><h1 class="h1">${esc(UNIT.name)}</h1><div class="muted">${esc(SC.title)} · ${S.assigned.length} patient${S.assigned.length > 1 ? 's' : ''} assigned to ${esc(S.student)} · ${S.mode === 'test' ? 'Test yourself' : 'Learn'} mode</div></div>
      <div class="row-s"><button class="btn ghost" type="button" data-act="showBrief">Scenario directions</button><button class="btn ghost" type="button" data-act="openReport">My shift report</button><button class="btn" type="button" data-act="endAsk">${S.ended ? 'View debrief' : 'End shift and debrief'}</button></div></div>
    ${briefStrip()}
    <div class="card"><div class="scroll"><table class="census"><thead><tr><th>Room</th><th>Patient</th><th>Diagnosis</th><th>GCD</th><th>Alerts</th><th>NEWS2</th><th>Tasks</th><th>New</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h3>My worklist</h3><div class="body">${S.assigned.map(id => { const p = P(id); const tk = tasks(p).filter(x => x.st !== 'upcoming'); return `<div class="wl"><div class="wlhead"><span class="room mono">${p.room}</span> <b>${esc(p.name)}</b></div>${tk.length ? `<ul class="tasklist">${tk.map(x => taskLi(x, id)).join('')}</ul>` : '<div class="muted small">Nothing due right now.</div>'}</div>`; }).join('')}</div></div>
    <div class="row end muted small">Shift ID <span class="mono">${esc(S.shiftId)}</span> · Done with this scenario? <button type="button" class="linkbtn" data-act="resetAsk">Start a different scenario</button></div>
  </section>`;
}
const taskLi = (x, id) => `<li class="task tk-${x.st}"><span class="mono">${hm(x.at)}</span><button type="button" class="linkbtn" data-act="goTab" data-id="${id}" data-tab="${x.tab}">${esc(x.text)}</button><span class="pill ${x.st === 'overdue' ? 'crit' : x.st === 'due' ? 'warn' : ''}">${x.st}</span></li>`;

/* ---- chart shell ---- */
const TABS = [['summary', 'Summary'], ['orders', 'Orders'], ['mar', 'MAR'], ['flow', 'Vitals & I&O'], ['assess', 'Assessment'], ['actions', 'Interventions'], ['lda', 'Lines & wounds'], ['notes', 'Notes'], ['care', 'Care plan & teaching'], ['results', 'Results'], ['comm', 'SBAR & messages'], ['handoff', 'Handoff'], ['medrec', 'Med rec'], ['discharge', 'Discharge']];
const chartTabs = p => TABS.filter(([k]) => k !== 'discharge' || p.dischargeRec);
function viewChart() {
  const p = P(), lv = latestVitals(p), nw = news2(lv, p.spo2Scale2, p);
  const badge = k => { const n = k === 'orders' ? p.orders.filter(isUnack).length : k === 'results' ? p.results.filter(r => r.needsAck && !r.ackT).length : k === 'comm' ? p.messages.filter(m => m.from !== 'student' && !m.read).length : k === 'medrec' ? (p.medrecDone ? 0 : 1) : 0; return n ? `<span class="badge">${n}</span>` : ''; };
  const bmi = (p.wt / ((p.ht / 100) ** 2)).toFixed(1);
  return `
  <section class="banner"><div class="wrap bannerin">
    <button type="button" class="linkbtn back" data-act="census">← Unit</button>
    <div class="pname">${esc(p.name)} <span class="pref">“${esc(p.pref)}”</span><span class="sub">${p.age} ${p.sex} · Rm ${p.room} · MRN <span class="mono">${p.mrn}</span> · DOB <span class="mono">${p.dob}</span></span></div>
    <div class="kv"><span class="k">Goals of care</span><span class="v">${gcdPill(p, true)}</span></div>
    <div class="kv"><span class="k">Ht / Wt / BMI</span><span class="v">${p.ht} cm · ${p.wt} kg · ${bmi}</span></div>
    <div class="kv"><span class="k">Attending</span><span class="v">${esc(prescriber(p.attending))}</span></div>
    <div class="kv"><span class="k">NEWS2</span><span class="v">${nw.score != null ? `<span class="news ${newsClass(nw.risk)}">${nw.score}</span> ${nw.risk}` : '—'}</span></div>
    ${p.isolation ? `<div class="iso kv"><span class="k">Isolation</span><span class="v">${esc(p.isolation.type)}</span></div>` : ''}
    <div class="kv"><span class="k">Fall risk</span><span class="v ${p.fall === 'High' ? 'tx-amber' : ''}">${p.fall}</span></div>
    <div class="allergy kv"><span class="k">Allergies</span><span class="v">${p.allergies.length ? p.allergies.map(a => `${esc(a.agent)} <span class="rx">(${esc(a.reaction)})</span>`).join('; ') : 'No known allergies'}</span></div>
  </div></section>
  <div class="chartgrid wrap">
    <nav class="sidenav" aria-label="Chart sections">${chartTabs(p).map(([k, l]) => `<button type="button" data-act="tab" data-tab="${k}" aria-current="${ui.tab === k ? 'page' : 'false'}">${l}${badge(k)}</button>`).join('')}</nav>
    <section class="chartmain" id="panel">${({ summary: tSummary, orders: tOrders, mar: tMAR, flow: tFlow, assess: tAssess, lda: tLDA, notes: tNotes, care: tCare, results: tResults, comm: tComm, handoff: tHandoff, medrec: tMedrec, actions: tActions, discharge: tDischarge })[ui.tab](p)}</section>
  </div>`;
}
function afterChart() {
  const p = P();
  if (ui.tab === 'comm') { let ch = false; p.messages.forEach(m => { if (m.from !== 'student' && !m.read) { m.read = true; ch = true; } }); if (ch) { L(p.id, 'view', 'Read prescriber message'); save(); } }
  $('#panel')?.addEventListener('input', () => { ui.dirty = true; }, { once: false });
  $$('[data-live]').forEach(el => el.addEventListener('input', () => liveCalc(el.dataset.live)));
  $$('[data-live]').forEach(el => el.addEventListener('change', () => liveCalc(el.dataset.live)));
  ['vitals', 'braden', 'morse', 'gcs'].forEach(liveCalc);
}

/* ---- summary ---- */
function tSummary(p) {
  const lv = latestVitals(p), nw = news2(lv, p.spo2Scale2, p), tk = tasks(p);
  const abn = [...p.results].filter(r => r.flag && r.flag !== '').sort((a, b) => b.t - a.t).slice(0, 6);
  const lastNote = [...p.notes].sort((a, b) => b.t - a.t)[0];
  return `<div class="grid2c">
    <div class="card span2"><h3>Worklist <span class="note">Now ${hm(now())}</span></h3><div class="body">${tk.length ? `<ul class="tasklist">${tk.map(x => taskLi(x, p.id)).join('')}</ul>` : '<div class="muted">Nothing due.</div>'}</div></div>
    <div class="card"><h3>Latest vital signs ${lv ? `<span class="note">${hm(lv.t)} · ${esc(lv.by)}</span>` : ''}</h3><div class="body">${lv ? `<div class="vgrid">
      ${vt('Temp', lv.temp, '°C')}${vt('HR', lv.hr, '/min')}${vt('RR', lv.rr, '/min')}${vt('BP', lv.sbp + '/' + lv.dbp, 'mmHg')}${vt('SpO₂', lv.spo2, '%')}${vt('O₂', lv.o2 === 'RA' ? 'Room air' : lv.o2 + ' ' + lv.flow + ' L', '')}${vt('Pain', lv.pain, '/10')}${vt('NEWS2', `<span class="news ${newsClass(nw.risk)}">${nw.score}</span>`, nw.risk, true)}
    </div>` : 'None'}</div></div>
    <div class="card"><h3>About this admission</h3><div class="body stack-s small">
      <div><b>Diagnosis:</b> ${esc(p.dx)}</div><div><b>History:</b> ${esc(p.hx)}</div><div><b>Admitted:</b> ${esc(p.admitted)}</div>
      <div><b>Diet:</b> ${esc(p.diet)}</div><div><b>Activity:</b> ${esc(p.activity)}</div><div><b>Goals of care:</b> ${p.gcd ? `${p.gcd} — ${esc(GCD[p.gcd].text)}` : '<span class="tx-red">Not yet documented</span>'}</div>
      ${p.isolation ? `<div><b>Isolation:</b> ${esc(p.isolation.type)} (${esc(p.isolation.reason)})</div>` : ''}</div></div>
    <div class="card"><h3>Active medications</h3><div class="body"><ul class="plain small">${medOrders(p).map(o => `<li>${o.status === 'new' ? '<span class="pill acc">New</span> ' : ''}${o.med.highAlert ? '<span class="pill crit">High alert</span> ' : ''}${esc(orderText(o))}</li>`).join('')}</ul></div></div>
    <div class="card"><h3>Abnormal results</h3><div class="body"><ul class="plain small">${abn.map(r => `<li><span class="mono">${hm(r.t)}</span> ${esc(r.test)} <b class="${r.flag === 'C' ? 'tx-red' : ''}">${esc(r.value)} ${esc(r.unit)}</b> <span class="flag">${r.flag === 'C' ? 'CRITICAL' : r.flag}</span></li>`).join('') || '<li class="muted">None</li>'}</ul></div></div>
    <div class="card span2"><h3>Last note ${lastNote ? `<span class="note">${hm(lastNote.t)} · ${esc(lastNote.by)} · ${lastNote.type}</span>` : ''}</h3><div class="body small">${lastNote ? noteBody(lastNote) : 'None'}</div></div>
  </div>`;
}
const vt = (k, v, u, raw) => `<div class="vt"><span class="k">${k}</span><span class="v mono">${raw ? v : esc(v ?? '—')}</span><span class="u">${esc(u)}</span></div>`;

/* ---- orders ---- */
function tOrders(p) {
  const nw = p.orders.filter(isUnack), act = p.orders.filter(o => o.status === 'active'), dc = p.orders.filter(o => o.status === 'dc');
  const groups = [['gcd', 'Goals of care'], ['med', 'Medications'], ['nursing', 'Nursing'], ['diet', 'Diet'], ['activity', 'Activity'], ['lab', 'Laboratory'], ['imaging', 'Imaging']];
  const line = o => `<li class="oline"><div>${esc(orderText(o))}${o.med?.hold ? `<div class="muted small">${esc(o.med.hold)}</div>` : ''}</div><div class="muted small nowrap">${esc(prescriber(o.by))} · ${hm(o.t)} · ${o.source}${o.readBack ? ' · read back' : ''}${o.pendingCosign ? ' · <span class="tx-amber">awaiting co-sign</span>' : ''}</div></li>`;
  return `
  ${nw.length ? `<div class="card attn"><h3>New orders — acknowledge before acting <span class="note">${nw.length}</span></h3><div class="body"><ul class="plain">${nw.map(o => `<li class="oline"><div><span class="pill acc">${o.type}</span> ${esc(orderText(o))}</div><div class="muted small nowrap">${esc(prescriber(o.by))} · ${hm(o.t)} · ${o.source}</div></li>`).join('')}</ul>
    <div class="row"><button class="btn" type="button" data-act="ackOrders">Review and acknowledge</button></div></div></div>` : ''}
  <div class="card"><h3>Active orders <span class="note">${act.length}</span><span class="spacer"></span><button class="btn ghost sm" type="button" data-act="phoneOrder">Enter verbal / telephone order</button></h3><div class="body stack">
    ${groups.map(([k, l]) => { const g = act.filter(o => o.type === k); return g.length ? `<div><div class="eyebrow">${l}</div><ul class="plain">${g.map(line).join('')}</ul></div>` : ''; }).join('')}
  </div></div>
  ${dc.length ? `<div class="card"><h3>Discontinued</h3><div class="body"><ul class="plain">${dc.map(o => `<li class="oline struck"><div>${esc(orderText(o))}</div><div class="muted small">${hm(o.dcT)} · ${esc(o.dcWhy || '')}</div></li>`).join('')}</ul></div></div>` : ''}`;
}

/* ---- MAR ---- */
function tMAR(p) {
  const t = now(), rows = medOrders(p);
  const sched = rows.filter(o => !o.med.prn && !o.med.infusion), prn = rows.filter(o => o.med.prn), inf = rows.filter(o => o.med.infusion);
  const head = o => { const m = o.med, al = allergyHit(p, m.name); return `<div class="drug">${esc(m.name)} <span class="dose">${esc(m.dose)}</span></div>
    <div class="small">${esc(m.route)} · ${esc(m.freq)}${m.infusion ? ' · ' + esc(m.infusion) : ''}</div>
    <div class="small muted">${esc(m.indication || '')}${m.prn ? ' · ' + esc(m.prnReason) : ''}</div>
    ${m.hold ? `<div class="small tx-amber">${esc(m.hold)}</div>` : ''}${m.scale ? `<div class="small muted">${esc(m.scale)}</div>` : ''}
    <div class="tags">${o.status === 'new' ? '<span class="pill acc">Unacknowledged</span>' : ''}${m.highAlert ? '<span class="pill crit">High alert · double check</span>' : ''}${m.controlled ? '<span class="pill warn">Controlled</span>' : ''}${al && S.settings.alerts ? `<span class="pill crit">ALLERGY: ${esc(al.agent)}</span>` : ''}<span class="muted small">Stock: ${esc(m.stock)}</span></div>`; };
  const chip = (o, time) => { const d = p.mar[`${o.id}@${time}`];
    if (d) return `<span class="done ${d.given ? '' : 'held'}" title="${esc(d.given ? 'Given' : 'Not given: ' + d.reason)}">${hm(d.t)} ${d.given ? '✓' : '✗'}<span>${esc(d.init)}</span></span>`;
    const st = t >= time + 60 ? 'overdue' : t >= time - 60 ? 'duenow' : '';
    return `<button class="due ${st}" type="button" data-act="docMed" data-id="${o.id}" data-time="${time}">${hm(time)}</button>`; };
  const prnInfo = o => { const ds = p.prn.filter(d => d.orderId === o.id).sort((a, b) => b.t - a.t); const last = ds.find(d => d.given); const h = freqHours(o.med.freq);
    const pend = ds.filter(d => d.given && !d.reassess && d.student);
    return `<div class="stack-s small">${last ? `<div>Last: <b class="mono">${hm(last.t)}</b> ${esc(last.amount || '')} (${esc(last.by)})</div>${h ? `<div>Next eligible: <b class="mono">${hm(last.t + h * 60)}</b></div>` : ''}` : '<div class="muted">Not given this admission</div>'}
      <div class="row-s"><button class="btn sm" type="button" data-act="docMed" data-id="${o.id}" data-time="prn">Give PRN</button>${pend.map(d => `<button class="btn ghost sm" type="button" data-act="reassess" data-id="${d.id}">Reassess ${hm(d.t)} dose</button>`).join('')}</div></div>`; };
  const scanned = p.scan.band;
  return `
  <div class="card"><div class="scanrow">
    <form class="scanform" data-act="scanSubmit" autocomplete="off"><label for="scanIn" class="sr">Scan or type a barcode</label><input class="input mono" id="scanIn" placeholder="Scan or type the wristband or medication barcode" spellcheck="false" autocapitalize="characters"><button class="btn sm ghost camscan" type="button" data-camscan="scanIn" aria-label="Scan QR code with camera">Camera</button><button class="btn sm" type="submit">Enter</button></form>
    <button class="btn ghost sm" type="button" data-act="scanBand">Scan wristband</button>
    <span class="pill ${scanned ? 'ok' : ''}">${scanned ? '✓ Patient verified' : 'Wristband not scanned'}</span>
  </div><div class="body small muted">Select a due time to document a dose. You can scan packages from the patient’s medication drawer inside the documentation window.</div></div>
  <div class="card"><h3>Scheduled <span class="note">Today · select a time to document</span></h3><div class="scroll"><table class="mar"><tbody>
    ${sched.map(o => `<tr><td class="medc">${head(o)}</td><td class="times">${o.med.times.filter(x => x >= 0 && x < 1440).map(x => chip(o, x)).join('')}</td></tr>`).join('') || '<tr><td class="muted">None</td></tr>'}
  </tbody></table></div></div>
  <div class="card"><h3>PRN</h3><div class="scroll"><table class="mar"><tbody>
    ${prn.map(o => `<tr><td class="medc">${head(o)}</td><td class="times">${prnInfo(o)}</td></tr>`).join('') || '<tr><td class="muted">None</td></tr>'}
  </tbody></table></div></div>
  ${inf.length ? `<div class="card"><h3>Continuous infusions</h3><div class="scroll"><table class="mar"><tbody>
    ${inf.map(o => { const lg = p.infusionLog.filter(x => x.orderId === o.id).pop(); return `<tr><td class="medc">${head(o)}</td><td class="times"><div class="stack-s small"><div>Rate now: <b>${esc(lg?.rate || o.med.pump || o.med.infusion)}</b></div>${lg ? `<div class="muted">${esc(lg.action)} ${hm(lg.t)} by ${esc(lg.by)}</div>` : '<div class="muted">Not yet verified this shift</div>'}<div><button class="btn sm" type="button" data-act="docInf" data-id="${o.id}">Document infusion</button></div></div></td></tr>`; }).join('')}
  </tbody></table></div></div>` : ''}`;
}

/* ---- flowsheets ---- */
function tFlow(p) {
  const m = monitor(p), vs = [...p.vitals].sort((a, b) => b.t - a.t);
  const s2 = p.spo2Scale2;
  const io7 = p.io.filter(i => i.t >= UNIT.shiftStart), io24 = p.io.filter(i => i.t >= now() - 1440);
  const sum = (a, k) => a.filter(i => i.kind === k).reduce((s, i) => s + i.ml, 0);
  return `
  <div class="grid2c">
    <div class="card"><h3>Bedside monitor <span class="note">live</span></h3><div class="body"><div class="monitor">
      <div><span class="k">HR</span><span class="v">${m.hr}</span><span class="u">${esc(m.rhythm || '')}</span></div>
      <div><span class="k">BP</span><span class="v">${m.sbp}/${m.dbp}</span></div>
      <div><span class="k">SpO₂</span><span class="v">${m.spo2}%</span><span class="u">${m.o2 === 'RA' ? 'Room air' : m.o2 + ' ' + m.flow + ' L/min'}</span></div>
      <div><span class="k">RR</span><span class="v">${m.rr}</span></div>
    </div>${m.note ? `<div class="obs">Observation: ${esc(m.note)}</div>` : ''}
    <div class="row-s" style="margin-top:10px"><button class="btn ghost sm" type="button" data-act="stim">Rouse / stimulate patient</button></div></div></div>
    <div class="card"><h3>Oxygen</h3><div class="body stack-s">
      <div class="small">Current: <b>${p.o2.device === 'RA' ? 'Room air' : esc(p.o2.device) + ' at ' + p.o2.flow + ' L/min'}</b>${p.o2Order ? ` · Order: ${p.o2Order.min}–${p.o2Order.max} L/min, target ${p.o2Order.target}` : ''}</div>
      <div class="row-s"><select class="input w-auto" id="o2dev"><option value="RA">Room air</option><option value="NP">Nasal prongs</option><option value="Mask">Simple face mask</option><option value="Venturi">Venturi mask</option></select>
      <input class="input w-80 mono" id="o2flow" type="number" min="0" max="15" step="0.5" value="${p.o2.flow}" aria-label="Flow L/min"><span class="small">L/min</span>
      <button class="btn sm" type="button" data-act="setO2">Apply</button></div></div></div>
  </div>
  <div class="card"><h3>Document vital signs <span class="note">${p.noNews ? 'NEWS2 is not used under 16: compare with age-based normal ranges' : 'NEWS2 ' + (s2 ? 'SpO₂ scale 2 (target 88–92%)' : 'SpO₂ scale 1')}</span></h3><div class="body stack">
    <div class="vform">
      ${fld('vTemp', 'Temp °C', 'number', 'step=0.1')}${fld('vHr', 'HR /min', 'number')}${fld('vRr', 'RR /min', 'number')}${fld('vSbp', 'Systolic', 'number')}${fld('vDbp', 'Diastolic', 'number')}${fld('vSpo2', 'SpO₂ %', 'number')}
      <div class="field"><label for="vO2">O₂</label><select class="input" id="vO2" data-live="vitals"><option value="RA">Room air</option><option value="NP">Nasal prongs</option><option value="Mask">Mask</option><option value="Venturi">Venturi</option></select></div>
      ${fld('vFlow', 'Flow L/min', 'number', 'step=0.5')}
      <div class="field"><label for="vAvpu">ACVPU</label><select class="input" id="vAvpu" data-live="vitals"><option value="A">Alert</option><option value="C">New confusion</option><option value="V">Voice</option><option value="P">Pain</option><option value="U">Unresponsive</option></select></div>
      ${fld('vPain', 'Pain /10', 'number', 'min=0 max=10')}
      <div class="field"><label for="vPoss">Sedation (POSS)</label><select class="input" id="vPoss"><option value="">—</option><option value="S">S — asleep, easy to rouse</option><option value="1">1 — awake, alert</option><option value="2">2 — slightly drowsy</option><option value="3">3 — frequently drowsy</option><option value="4">4 — somnolent</option></select></div>
    </div>
    <div class="row between"><div class="row-s"><button class="btn ghost sm" type="button" data-act="pullMonitor">Fill from monitor and patient</button><span class="small">NEWS2: <b id="newsLive">—</b></span></div><button class="btn" type="button" data-act="saveVitals">File vital signs</button></div>
  </div></div>
  <div class="card"><h3>Trends</h3><div class="body"><div class="trends">${trendCharts(p)}</div></div></div>
  <div class="card"><h3>Vital signs history</h3><div class="scroll"><table class="simple"><thead><tr><th>Time</th><th>T</th><th>HR</th><th>RR</th><th>BP</th><th>SpO₂</th><th>O₂</th><th>ACVPU</th><th>Pain</th><th>POSS</th><th>NEWS2</th><th>By</th></tr></thead><tbody>
    ${vs.map(v => { const n = news2(v, s2, p); return `<tr><td class="mono">${hm(v.t)}</td><td>${v.temp ?? ''}</td><td>${v.hr ?? ''}</td><td>${v.rr ?? ''}</td><td>${v.sbp ?? ''}/${v.dbp ?? ''}</td><td>${v.spo2 ?? ''}</td><td>${v.o2 === 'RA' ? 'RA' : esc(v.o2) + ' ' + v.flow + 'L'}</td><td>${esc(v.avpu)}</td><td>${v.pain ?? ''}</td><td>${esc(v.poss || '')}</td><td><span class="news ${newsClass(n.risk)}">${n.score}</span></td><td class="small">${esc(v.by)}</td></tr>`; }).join('')}
  </tbody></table></div></div>
  <div class="grid2c">
    <div class="card"><h3>Intake &amp; output</h3><div class="body stack">
      <div class="iotot"><div><span class="k">This shift in</span><b>${sum(io7, 'in')} mL</b></div><div><span class="k">This shift out</span><b>${sum(io7, 'out')} mL</b></div><div><span class="k">24 h balance</span><b>${sum(io24, 'in') - sum(io24, 'out') > 0 ? '+' : ''}${sum(io24, 'in') - sum(io24, 'out')} mL</b></div></div>
      <div class="row-s"><select class="input w-auto" id="ioKind"><option value="in">Intake</option><option value="out">Output</option></select>

function trendCharts(p) {
  const vs = [...p.vitals].sort((a, b) => a.t - b.t); if (vs.length < 2) return '<div class="muted">Not enough readings yet.</div>';
  const s2 = p.spo2Scale2;
  const defs = [['hr', 'Heart rate', '/min', 40, 140, [51, 90]], ['sbp', 'Systolic BP', 'mmHg', 70, 190, [111, 219]], ['rr', 'Resp. rate', '/min', 5, 35, [12, 20]], ['spo2', 'SpO₂', '%', 80, 100, s2 ? [88, 92] : [96, 100]], ['temp', 'Temperature', '°C', 35, 40.5, [36.1, 38]]];
  const t0 = vs[0].t, t1 = Math.max(vs[vs.length - 1].t, t0 + 60), W = 300, H = 112, L = 30, R = 10, Tp = 14, B = 20;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  return defs.map(([k, label, unit, lo, hi, [rl, rh]]) => {
    const y = v => Tp + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - Tp - B);
    const pts = vs.filter(v => v[k] != null && v[k] !== '');
    const last = pts[pts.length - 1];
    const band = `<rect x="${L}" y="${y(Math.min(rh, hi))}" width="${W - L - R}" height="${Math.max(0, y(Math.max(rl, lo)) - y(Math.min(rh, hi)))}" style="fill:var(--accent-soft)"/>`;
    const line = `<polyline points="${pts.map(v => x(v.t).toFixed(1) + ',' + y(+v[k]).toFixed(1)).join(' ')}" style="fill:none;stroke:var(--accent);stroke-width:2"/>`;
    const dots = pts.map(v => `<circle cx="${x(v.t).toFixed(1)}" cy="${y(+v[k]).toFixed(1)}" r="3" style="fill:${+v[k] < rl || +v[k] > rh ? 'var(--red)' : 'var(--accent)'}"/>`).join('');
    const ticks = [lo, hi].map(v => `<text x="${L - 4}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${v}</text>`).join('');
    const xl = `<text x="${L}" y="${H - 4}" style="fill:var(--muted);font-size:10px">${hm(t0)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${hm(t1)}</text>`;
    return `<figure class="trend"><figcaption><span>${label}</span><b class="mono">${last ? last[k] : '—'}</b><span class="muted small">${unit}</span></figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} trend">${band}${ticks}${xl}${line}${dots}</svg></figure>`;
  }).join('');
}

    ${m.sbar ? `<div class="small"><b>S</b> ${esc(m.sbar.S)}<br><b>B</b> ${esc(m.sbar.B)}<br><b>A</b> ${esc(m.sbar.A)}<br><b>R</b> ${esc(m.sbar.R)}</div>` : `<div>${esc(m.text)}</div>`}

}

/* ---- handoff ---- */
function handoffText(p) {
  const lv = latestVitals(p), nw = news2(lv, p.spo2Scale2, p), tk = tasks(p, now()).filter(x => x.st !== 'upcoming');
  const io7 = p.io.filter(i => i.t >= UNIT.shiftStart), sum = k => io7.filter(i => i.kind === k).reduce((s, i) => s + i.ml, 0);
  const pend = p.results.filter(r => r.pending).map(r => r.test);
  const lastA = [...p.assess].filter(a => a.kind === 'systems').sort((a, b) => b.t - a.t)[0];
  return `S — ${p.name}, ${p.age} ${p.sex}, Rm ${p.room}. ${p.dx}. GCD ${gcdLabel(p.gcd)}${p.isolation ? '. ' + p.isolation.type + ' precautions' : ''}.
B — ${p.hx}. Allergies: ${p.allergies.map(a => a.agent + ' (' + a.reaction + ')').join(', ') || 'none known'}. ${p.admitted}.
A — Last VS ${lv ? hm(lv.t) : ''}: T ${lv?.temp}, HR ${lv?.hr}, RR ${lv?.rr}, BP ${lv?.sbp}/${lv?.dbp}, SpO₂ ${lv?.spo2}% ${lv?.o2 === 'RA' ? 'RA' : lv?.o2 + ' ' + lv?.flow + ' L'}, pain ${lv?.pain}/10. NEWS2 ${nw.score} (${nw.risk}). Shift I&O: in ${sum('in')} mL / out ${sum('out')} mL.${lastA ? ' Assessment ' + hm(lastA.t) + ': ' + lastA.summary + '.' : ' No head-to-toe documented this shift.'}
R — Outstanding: ${tk.map(x => x.text).join('; ') || 'nothing outstanding'}. Pending results: ${pend.join(', ') || 'none'}.`;
}
function tHandoff(p) {
  return `<div class="card"><h3>Shift handoff (SBAR) <span class="note">Generated from the chart — edit before giving report</span></h3><div class="body stack">
    <textarea class="input mono-ish" id="hoText" rows="10">${esc(p.handoff || handoffText(p))}</textarea>
    <div class="row between"><button class="btn ghost sm" type="button" data-act="hoRefresh">Regenerate from chart</button><div class="row-s"><label class="small" for="hoTo">Report given to</label><select class="input w-auto" id="hoTo">${(p.handoffTo || ['Oncoming nurse']).map(x => `<option>${esc(x)}</option>`).join('')}</select><button class="btn" type="button" data-act="hoGive">Record report given</button></div></div>

function tMedrec(p) {
  const bottles = p.homeMeds.some(h => h.bottle != null) && S.flags[p.id + '-bottles'];
  const hasDisc = p.homeMeds.some(h => h.disc != null);

    ${p.homeMeds.map((h, i) => h.onlyBottle && !bottles ? '' : `<tr><td>${esc(h.med)}</td>${bottles ? `<td>${esc(h.bottle || '—')}</td>` : ''}<td>${p.medrecDone ? esc(h.last) : `<input class="input" id="mrLast${i}" value="${esc(h.last)}" placeholder="e.g. yesterday 2100">`}</td><td>${p.medrecDone ? esc(h.source) : `<select class="input" id="mrSrc${i}"><option value="">Select</option>${['Patient', 'Family member', 'Pharmacy list', 'Pill bottles', 'Emergency record'].map(s => `<option${h.source === s ? ' selected' : ''}>${s}</option>`).join('')}</select>`}</td>${hasDisc ? `<td>${p.medrecDone ? esc(h.marked || '') : h.disc != null ? `<select class="input" id="mrDisc${i}"><option value="">Select</option><option>Matches</option><option>Discrepancy</option></select>` : ''}</td>` : ''}<td>${p.medrecDone ? '✓' : `<input type="checkbox" id="mrOk${i}" aria-label="Verified">`}</td></tr>`).join('')}
  </tbody></table></div>${p.medrecDone ? '' : `<div class="body stack-s"><div class="field"><label for="mrNote">Discrepancies or concerns for the prescriber</label><textarea class="input" id="mrNote" rows="2"></textarea></div><div class="row end"><button class="btn" type="button" data-act="medrec">Complete medication reconciliation</button></div></div>`}</div>`;
}

const LEVELS = [

  ['Competent', 'Benner stage 3. Deliberate planning: several patients or a protocol that unfolds over hours, where you choose the order and manage time.'],

/* ---------------- order helpers ---------------- */
function orderFromForm(pre, pid, by, source, status) {
  const type = val(pre + 'Type'); if (!type) return null; const t = now();
  if (type === 'med') {
    const name = val(pre + 'Name'), dose = val(pre + 'Dose'); if (!name || !dose) return 'Enter at least the drug and dose.';
    const freq = val(pre + 'Freq') || 'Once — STAT'; const prn = checked(pre + 'Prn');
    const tm = val(pre + 'Times').split(',').map(parseHM).filter(x => x != null);
    const times = prn ? [] : (tm.length ? tm : [t]);
    const code = 'RX' + name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    return med(uid(pid + '-o'), { name, dose, route: val(pre + 'Route') || 'PO', freq, times, prn, prnReason: prn ? 'As needed' : '', highAlert: checked(pre + 'HA'), indication: '', stock: val(pre + 'Stock') || name + ' ' + dose, code }, { t, by, source, status });
  }
  const text = val(pre + 'Text'); if (!text) return 'Enter the order text.';
  return ord(uid(pid + '-o'), type, text, { t, by, source, status });
}

function recordAction(k, detail) {
  const p = P(), a = NURSING_ACTIONS[k], t = now(), result = a.result ? a.result(p, S, t) : '';
  p.actions.push({ key: k, label: a.label, t, detail, result });
  L(p.id, 'action', `${a.label}${detail ? ': ' + detail : ''}${result ? ' — ' + result : ''}`);
  if (SC.onAction) { const r = SC.onAction(k, p, S, t, detail); if (r) { if (r.notice) S.notices.push({ id: uid('n'), t, pid: p.id, text: r.notice, hint: r.hint || '', seen: false }); if (r.reply) S.pendingReplies.push({ pid: p.id, at: t + (r.reply.delay ?? 3), by: r.reply.by, text: r.reply.text, orders: r.reply.orders ? r.reply.orders(t + (r.reply.delay ?? 3)) : [], flag: r.reply.flag, drawerAdd: r.reply.drawerAdd }); } }
  save(); render(); if (result) info(a.label, `<div class="alertbox">${esc(result)}</div>`); else toast(a.label + ' — recorded');
}
