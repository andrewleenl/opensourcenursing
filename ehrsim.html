function copyText(txt, label) {
  const done = () => toast('Copied');
  const fallback = () => { const b = $('#copyBox'); if (b) { b.hidden = false; b.value = label + '\n' + txt; b.select(); toast('Select all and copy'); } };
  try { navigator.clipboard.writeText(label + '\n' + txt).then(done).catch(fallback); } catch (e) { fallback(); }
}
function openChart(id, tab) {
  const p = P(id); ui.tab = tab || 'summary';
  if (p.isolation) {
    ui.ppePid = id; ui.ppeTab = ui.tab;
    return modal(`${esc(p.isolation.type)} precautions`, `<div class="alertbox warn"><b>${esc(p.name)}, Rm ${p.room}</b> — ${esc(p.isolation.reason)}. Confirm before entering the room.</div>
      ${(p.isolation.items || ['Hand hygiene', 'Gown', 'Gloves', 'Surgical / procedure mask', 'Eye protection']).map((l, i) => `<label class="chk"><input type="checkbox" id="ppe${i + 1}"> ${esc(l)}</label>`).join('')}`,
      `<button class="btn ghost" type="button" data-act="closeModal">Cancel</button><button class="btn" type="button" data-act="ppeGo">Enter room</button>`);
  }
  ui.view = 'chart'; ui.pid = id; L(id, 'view', 'Opened chart'); render(); window.scrollTo({ top: 0 });
}
function liveCalc(kind) {
  if (kind === 'vitals' && $('#newsLive')) { const p = P(); const v = { temp: num('vTemp'), hr: num('vHr'), rr: num('vRr'), sbp: num('vSbp'), spo2: num('vSpo2'), o2: val('vO2'), avpu: val('vAvpu') };
    const any = [v.temp, v.hr, v.rr, v.sbp, v.spo2].some(x => x != null); const n = news2(v, p.spo2Scale2, p); $('#newsLive').innerHTML = any ? `<span class="news ${newsClass(n.risk)}">${n.score}</span> ${n.risk}` : '—'; }
  if (kind === 'braden' && $('#bradenTot')) { const v = BRADEN.map((_, i) => num('br' + i)); $('#bradenTot').textContent = v.some(x => x == null) ? '—' : (t => t + ' · ' + bradenRisk(t))(v.reduce((a, b) => a + b, 0)); }
  if (kind === 'morse' && $('#morseTot')) { const v = MORSE.map((_, i) => num('mo' + i)); $('#morseTot').textContent = v.some(x => x == null) ? '—' : (t => t + (t >= 45 ? ' · high' : t >= 25 ? ' · moderate' : ' · low'))(v.reduce((a, b) => a + b, 0)); }
  if (kind === 'ciwa' && $('#ciwaTot')) { const v = CIWA.map((_, i) => num('ciwa' + i)); $('#ciwaTot').textContent = v.some(x => x == null) ? '—' : (t => t + ' · ' + ciwaBand(t))(v.reduce((a, b) => a + b, 0)); }
  if (kind === 'gcs' && $('#gcsTot')) { const v = GCS.map((_, i) => num('gc' + i)); $('#gcsTot').textContent = v.some(x => x == null) ? '—' : v.reduce((a, b) => a + b, 0); }
}

/* ---------------- scanning ---------------- */
function mdScan(raw) {
  const p = P(), o = p.orders.find(x => x.id === ui.md.orderId), code = String(raw).toUpperCase().replace(/\s+/g, ''), k = keepDoc(), on = S.settings.alerts;
  const msg = (cls, html) => { ui.md.scanMsg = { cls, html }; };
  ui.md.scanMsg = null;
  if (code.startsWith('PT')) {
    const owner = Object.values(S.pts).find(x => 'PT' + x.mrn === code);
    L(p.id, 'scan', owner ? `Scanned wristband ${code}` : 'Unrecognized barcode ' + raw);
    if (!owner) msg('warn', `“${esc(raw)}” is not a wristband or medication on this unit.`);
    else if (owner.id !== p.id) { if (on) msg('crit', `<b>Wrong patient.</b> This wristband belongs to ${esc(owner.name)} (Rm ${owner.room}). You are documenting for ${esc(p.name)}.`); }
    else p.scan.band = true;
  } else {
    const any = Object.values(S.pts).flatMap(x => x.orders).find(x => x.med?.code === code) || (SC.extraCodes?.[code] ? { med: SC.extraCodes[code] } : null);
    L(p.id, 'scan', any ? `Scanned ${any.med.stock}` : 'Unrecognized barcode ' + raw);
    const al = any && allergyHit(p, any.med.name);
    if (!any) msg('warn', `“${esc(raw)}” is not a medication or wristband on this unit.`);
    else if (al && on) msg('crit', `<b>ALLERGY.</b> ${esc(p.name)} is allergic to ${esc(al.agent)} (${esc(al.reaction)}). Do not give ${esc(any.med.name)}.`);
    else if (code !== o.med.code) { if (on) msg('crit', `<b>Wrong medication.</b> You scanned ${esc(any.med.stock)}. This dose is ${esc(o.med.name)} ${esc(o.med.dose)} (${esc(o.med.stock)}).`); }
    else { if (!p.scan.meds.includes(code)) p.scan.meds.push(code); if (!p.scan.band && on) msg('warn', 'Medication scanned. Scan the patient’s wristband too.'); }
  }
  ui.md.warnings = null; drawDoc(k);
}
function doScan(raw, onscreen) {
  const p = P(), code = String(raw).toUpperCase().replace(/\s+/g, ''), how = onscreen ? ' (on-screen)' : '';
  if (code.startsWith('PT')) {
    const owner = Object.values(S.pts).find(x => 'PT' + x.mrn === code);
    if (!owner) { L(p.id, 'scan', 'Unrecognized barcode ' + raw); render(); return info('Barcode not recognized', `“${esc(raw)}” is not a wristband or medication on this unit.`, 'warn'); }
    L(p.id, 'scan', `Scanned wristband ${code}${how}`);
    if (owner.id !== p.id) { render(); return S.settings.alerts ? info('Wrong patient', `This wristband belongs to ${esc(owner.name)} (Rm ${owner.room}). You are charting on ${esc(p.name)}.`, 'crit') : toast('Wristband scanned'); }
    p.scan.band = true; render(); return toast('Patient verified: ' + p.name);
  }
  const mine = medOrders(p).find(o => o.med.code === code), any = Object.values(S.pts).flatMap(x => x.orders).find(o => o.med?.code === code) || (SC.extraCodes?.[code] ? { med: SC.extraCodes[code] } : null);
  if (!any) { L(p.id, 'scan', 'Unrecognized barcode ' + raw); render(); return info('Barcode not recognized', `“${esc(raw)}” is not a medication or wristband on this unit.`, 'warn'); }
  if (!p.scan.meds.includes(code)) p.scan.meds.push(code);
  L(p.id, 'scan', `Scanned ${any.med.stock}${how}`); render();
  if (S.settings.alerts) {
    const al = allergyHit(p, any.med.name); if (al) return info('ALLERGY', `${esc(p.name)} is allergic to ${esc(al.agent)} (${esc(al.reaction)}). Do not give ${esc(any.med.name)}.`, 'crit');
    if (!mine) return info('Not ordered for this patient', `${esc(any.med.stock)} is not on ${esc(p.name)}'s MAR.`, 'crit');
    if (!p.scan.band) return info('Scan the wristband first', 'Patient identity has not been confirmed for this medication pass.', 'warn');
  }
  toast('Scanned: ' + any.med.stock);
}

/* ---------------- events & init ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'FORM') return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-act="scanSubmit"]')) { e.preventDefault(); const v = val('scanIn'); if (v) doScan(v, false); }
  if (e.target.closest('[data-act="mdScanSubmit"]')) { e.preventDefault(); const v = val('mdScanIn'); if (v) mdScan(v); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) closeModal();
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACT[e.target.dataset.act](e.target);
});
document.addEventListener('input', e => { if (e.target.id === 'verIn') ui.dirty = true; if (e.target.id === 'resetWord') { const b = $('#resetGo'); if (b) b.disabled = e.target.value.trim().toLowerCase() !== 'clear'; } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'resetWord' && !$('#resetGo')?.disabled) ACT.resetYes(); });
document.addEventListener('change', e => { if (e.target.id === 'fmPid') { ui.facPid = e.target.value; render(); } });
if (S && (!S.scenario || !useScenario(S.scenario))) { S = null; try { localStorage.removeItem(KEY); } catch (e) { } }
if (S) { ui.view = S.ended ? 'debrief' : 'census'; } else ui.view = 'start';
render(); setInterval(tick, 1000);

</script>

<script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
  var deferredPrompt = null;
  var installBtn = document.getElementById('pwaInstallBtn');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.navigator.standalone === true;

  if (isIOS && !isStandalone && installBtn) {
    installBtn.hidden = false;
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn && !isStandalone) installBtn.hidden = false;
  });

  if (installBtn) {
    installBtn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          installBtn.hidden = true;
        });
      } else if (isIOS) {
        if (typeof modal === 'function') {
          modal(
            'Install on iPhone or iPad',
            '<div style="font-size:14.5px;line-height:1.6">' +
  '<p style="margin:0 0 12px">Apple iOS and iPadOS require manual installation from your browser toolbar:</p>' +
  '<ol style="margin:0 0 14px;padding-left:22px">' +
    '<li style="margin-bottom:8px">Tap the <strong>Share</strong> button <span style="display:inline-block;padding:1px 6px;border:1px solid #CBD6D2;border-radius:4px;font-family:monospace">&#9113;</span> (the square with an upward arrow) at the bottom of Safari on iPhone or top-right on iPad.</li>' +
    '<li style="margin-bottom:8px">Scroll down the share menu and tap <strong>Add to Home Screen</strong>.</li>' +
    '<li>Tap <strong>Add</strong> in the top-right corner to install <strong>OpenNursing</strong> as a full-screen offline app.</li>' +
  '</ol>' +
'</div>',
            '<button class="btn" type="button" data-act="closeModal">Got it</button>'
          );
        }
      }
    });
  }

  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    if (installBtn) installBtn.hidden = true;
  });
})();
</script>

<script>
/* Camera QR scanning for the scan boxes (iPad / phone / laptop camera).
   A decoded QR is placed in the scan box and submitted, exactly as if it had been typed or scanned. */
(function () {
  var root = document.createElement('div');
  root.id = 'camRoot';
  root.hidden = true;
  root.innerHTML =
    '<div class="cam-scrim" role="dialog" aria-modal="true" aria-labelledby="camTitle">' +
      '<div class="cam-box">' +
        '<p class="cam-title" id="camTitle">Scan QR code</p>' +
        '<div class="cam-view"><video playsinline muted autoplay></video><div class="cam-frame"></div></div>' +
        '<p class="cam-msg" aria-live="polite"></p>' +
        '<button type="button" class="btn ghost cam-close">Cancel</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(root);

  var video = root.querySelector('video');
  var frame = root.querySelector('.cam-frame');
  var msg = root.querySelector('.cam-msg');
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stream = null, raf = 0, targetId = null, busy = false, odd = false;

  function say(text, isErr) { msg.textContent = text; msg.classList.toggle('err', !!isErr); }

  function stop() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    frame.classList.remove('hit');
    root.hidden = true;
  }

  function start(id) {
    targetId = id; busy = false;
    root.hidden = false;
    say('Hold the QR code inside the square.');
    if (!window.isSecureContext) {
      say('The camera only works when the sim is opened from a secure (https://) web address.', true); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('This browser cannot use the camera.', true); return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }
    }).then(function (s) {
      if (root.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      video.srcObject = s;
      var p = video.play(); if (p && p.catch) p.catch(function () {});
      raf = requestAnimationFrame(loop);
    }).catch(function (err) {
      say(err && err.name === 'NotAllowedError'
        ? 'Camera access was blocked. Allow the camera for this website (on iPad: Settings › Apps › Safari › Camera), then try again.'
        : 'Could not start the camera' + (err && err.name ? ' (' + err.name + ')' : '') + '.', true);
    });
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    odd = !odd; if (odd || busy || video.readyState < 2) return;   // decode every second frame
    var vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh) return;
    var scale = Math.min(1, 800 / Math.max(vw, vh));
    var w = Math.round(vw * scale), h = Math.round(vh * scale);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    if (r && r.data && r.data.trim()) found(r.data.trim());
  }

  function found(code) {
    busy = true;
    frame.classList.add('hit');
    say('Scanned ' + code);
    setTimeout(function () {
      stop();
      var input = document.getElementById(targetId);
      if (!input) return;
      input.value = code;
      var form = input.closest('form');
      if (!form) return;
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    }, 250);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-camscan]');
    if (b) { e.preventDefault(); start(b.getAttribute('data-camscan')); return; }
    if (e.target.closest('.cam-close')) { e.preventDefault(); stop(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !root.hidden) { e.stopPropagation(); stop(); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden && !root.hidden) stop(); });
})();
</script>
