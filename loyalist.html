<script>
/* Camera QR scanning for the scan boxes (iPad / phone / laptop camera).
   A decoded QR is placed in the scan box and submitted, exactly as if it had been typed or scanned. */
(function () {
  var root = document.createElement('div');
  root.id = 'camRoot';
  root.hidden = true;
  root.innerHTML =
    '<div class="cam-scrim" role="dialog" aria-modal="true" aria-labelledby="camTitle">' +
      '<div class="cam-box">' +
        '<p class="cam-title" id="camTitle">Scan QR code</p>' +
        '<div class="cam-view"><video playsinline muted autoplay></video><div class="cam-frame"></div></div>' +
        '<p class="cam-msg" aria-live="polite"></p>' +
        '<button type="button" class="btn ghost cam-close">Cancel</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(root);

  var video = root.querySelector('video');
  var frame = root.querySelector('.cam-frame');
  var msg = root.querySelector('.cam-msg');
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stream = null, raf = 0, targetId = null, busy = false, odd = false, seen = {};

  function say(text, isErr) { msg.textContent = text; msg.classList.toggle('err', !!isErr); }

  function stop() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    frame.classList.remove('hit');
    root.hidden = true;
  }

  function start(id) {
    targetId = id; busy = false; seen = {};
    root.hidden = false;
    say('Hold the QR code inside the square.');
    if (!window.isSecureContext) {
      say('The camera only works when the sim is opened from a secure (https://) web address.', true); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('This browser cannot use the camera.', true); return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }
    }).then(function (s) {
      if (root.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      video.srcObject = s;
      var p = video.play(); if (p && p.catch) p.catch(function () {});
      raf = requestAnimationFrame(loop);
    }).catch(function (err) {
      say(err && err.name === 'NotAllowedError'
        ? 'Camera access was blocked. Allow the camera for this website (on iPad: Settings › Apps › Safari › Camera), then try again.'
        : 'Could not start the camera' + (err && err.name ? ' (' + err.name + ')' : '') + '.', true);
    });
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    odd = !odd; if (odd || busy || video.readyState < 2) return;   // decode every second frame
    var vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh) return;
    var scale = Math.min(1, 800 / Math.max(vw, vh));
    var w = Math.round(vw * scale), h = Math.round(vh * scale);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    if (r && r.data && r.data.trim()) { var c = r.data.trim(); if (seen[c]) return; found(c); }
  }

  function found(code) {
    busy = true;
    frame.classList.add('hit');
    say('Scanned ' + code);
    setTimeout(function () {
      var input = document.getElementById(targetId), form = input && input.closest('form');
      if (!form) { stop(); return; }
      input.value = code;
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      var next = (targetId === 'mdScanIn' && window.scanNext) ? window.scanNext() : null;
      if (!next) { stop(); return; }
      seen[code] = true;                              // keep the camera open for the next code; ignore this one from now on
      frame.classList.remove('hit'); say(next); busy = false;
    }, 250);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-camscan]');
    if (b) { e.preventDefault(); start(b.getAttribute('data-camscan')); return; }
    if (e.target.closest('.cam-close')) { e.preventDefault(); stop(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !root.hidden) { e.stopPropagation(); stop(); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden && !root.hidden) stop(); });
})();
</script>
