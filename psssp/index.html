		<style>

#status-title {

#status-sub {

#status-splash {

}

}

}

#status-notice {
	background-color: #4b2b36;

		<div id="status">
			<h1 id="status-title">Psssp Psssp!</h1>
			<p id="status-sub">Sneaking past the party to find the cat...</p>
			<img id="status-splash" class="show-image--true fullsize--false use-filter--false" src="index.png" alt="Pickle the cat curled up on a cushion at night">

			<div id="status-caption">Loading house party...</div>

		<script>
// The engine is published in parts (Cloudflare's 25 MiB file limit); this
// hands Godot one continuous download made of the parts in order.
(function () {
	const parts = ["index.wasm.part1.bin", "index.wasm.part2.bin"];
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = String(typeof input === 'string' ? input : input.url).split('?')[0];
		if (!url.endsWith('index.wasm')) {
			return realFetch(input, init);
		}
		return Promise.all(parts.map((p) => realFetch(p))).then((responses) => {
			const bad = responses.find((r) => !r.ok);
			if (bad) {
				return bad;
			}
			let i = 0;
			let reader = responses[0].body.getReader();
			const stream = new ReadableStream({
				pull(controller) {
					function step(result) {
						if (!result.done) {
							controller.enqueue(result.value);
							return undefined;
						}
						i += 1;
						if (i >= responses.length) {
							controller.close();
							return undefined;
						}
						reader = responses[i].body.getReader();
						return reader.read().then(step);
					}
					return reader.read().then(step);
				},
			});
			return new Response(stream, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
		});
	};
}());
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6274864,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const gameCanvas = document.getElementById('canvas');

	if (gameCanvas) {
		gameCanvas.setAttribute('tabindex', '0');
		const refocus = () => { if (!initializing) gameCanvas.focus({ preventScroll: true }); };
		window.addEventListener('pointerdown', refocus, { passive: true });
		window.addEventListener('keydown', (ev) => {
			if (!initializing && ['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.code)) {
				ev.preventDefault();
			}
		}, { capture: false });
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				const cap = document.getElementById('status-caption');
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (cap) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						cap.textContent = pct < 95 ? ('Loading house party... ' + pct + '%') : 'Waking up Pickle...';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
