.bar i{display:block;height:100%;width:2%;border-radius:6px;background:linear-gradient(90deg,#E2774F,#F29A6E);box-shadow:0 0 14px rgba(242,154,110,.8);transition:width .2s ease}

#city{bottom:0;height:34vh}
#sky{top:0;height:56vh}

  el(c, 'rect', { x: 0, y: H - 160, width: W, height: 160, fill: 'url(#fade)' });
